# ===================================================================
# 1. NOMBRE DE LA APLICACIÓN Y PUERTO DEL SERVIDOR
# ===================================================================
spring.application.name=backendinmobiliaria
server.port=8080

# ===================================================================
# 2. CONEXIÓN A BASE DE DATOS POSTGRESQL
# ===================================================================
# Reemplaza "nombre_tu_bd", "postgres" y "tu_password" con tus credenciales locales o del servidor
spring.datasource.url=jdbc:postgresql://localhost:5432/db_inmobiliaria
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
# ===================================================================
# 3. CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# 'update' crea o actualiza las tablas automáticamente según tus @Entity (incluyendo el nuevo campo contrasena en Usuario)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Evita advertencias de sesiones abiertas en las vistas y mejora el rendimiento con JOIN FETCH
spring.jpa.open-in-view=false

# ===================================================================
# 4. SEGURIDAD JWT (JJWT 0.11.5)
# ===================================================================
# Clave secreta en formato Base64 de 256 bits (requerida por Keys.hmacShaKeyFor)
app.jwt.secret=VGhpcy1Jcy1BLVZlcmlmeS1TZWN1cmUtMjU2LUJpdC1LZXktRm9yLUluTW9iaWxpYXJpYS1DUk0tMjAyNg==

# Tiempo de expiración del token en milisegundos (86400000 ms = 24 horas)
app.jwt.expiration-milliseconds=86400000

# ===================================================================
# 5. CONFIGURACIÓN DE CORS (CONEXIÓN CON HOSTINGER Y ENTORNO LOCAL)
# ===================================================================
# IMPORTANTE: Separar por comas SIN espacios en blanco.
# Incluye puertos locales comunes (Vite/Vue/React) y los dominios de producción en Hostinger
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,https://tudominio-inmobiliaria.com,https://crm.tudominio-inmobiliaria.com

