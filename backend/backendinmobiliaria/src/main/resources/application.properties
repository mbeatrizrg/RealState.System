spring.application.name=backendinmobiliaria
server.port=${PORT:8080}

# ===== Variables de entorno =====
# Las credenciales NO se escriben aqui. Se leen de variables de entorno o del archivo .env
# (en la raiz de backendinmobiliaria, ignorado por git). Copiar .env.example a .env y llenarlo.
spring.config.import=optional:file:.env[.properties]

# ===== Conexion a Supabase (PostgreSQL) =====
# Se usa el Session Pooler de Supabase (puerto 5432): funciona con IPv4 y mantiene sesiones normales.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (Hikari). El plan gratuito de Supabase limita las conexiones, por eso un pool pequeño
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# ===== JPA / Hibernate =====
# none: Hibernate no modifica las tablas de Supabase (el esquema se maneja desde Supabase, ver db/migraciones).
# validate: verifica al arrancar que las entidades coinciden con las tablas (util para detectar diferencias).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
# Respeta los nombres entre comillas de Supabase ("Inmueble", "isVendido", "ubicación"), ver config/NamingStrategySupabase
spring.jpa.hibernate.naming.physical-strategy=com.rifatrichani.backendinmobiliaria.config.NamingStrategySupabase
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== CORS =====
# Dominios del frontend que pueden llamar a la API, separados por coma (ej: http://localhost:5173,https://midominio.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Seguridad JWT =====
# Clave HMAC en Base64 de al menos 256 bits (32 bytes). Sin valor por defecto: la aplicacion no arranca si falta.
# Generar una con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
# Duracion del token en milisegundos (por defecto 8 horas)
app.jwt.expiration-milliseconds=${JWT_EXPIRACION_MS:28800000}

# ===== Autenticacion =====
# true: los usuarios del portal deben confirmar su correo con un codigo antes de iniciar sesion
app.auth.verificacion-correo=${AUTH_VERIFICACION_CORREO:true}
# Opcional: asigna la contraseña inicial a un empleado administrador que ya existe en Supabase y no tiene contraseña
app.auth.admin-inicial.correo=${ADMIN_INICIAL_CORREO:}
app.auth.admin-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}

# ===== Correo (SMTP) =====
# Para Gmail se usa una "contraseña de aplicacion", nunca la contraseña de la cuenta
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
