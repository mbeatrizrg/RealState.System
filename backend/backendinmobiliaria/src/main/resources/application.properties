spring.application.name=backendinmobiliaria

# ===== Variables de entorno =====
# Las credenciales NO se escriben aqui. Se leen de variables de entorno o del archivo .env
# (en la raiz de backendinmobiliaria, ignorado por git). Copiar .env.example a .env y llenarlo.
spring.config.import=optional:file:.env[.properties]

# ===== Conexion a Supabase (PostgreSQL) =====
# Se usa el Session Pooler de Supabase (puerto 5432): funciona con IPv4 y mantiene sesiones normales.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (Hikari). El plan gratuito de Supabase limita las conexiones, por eso un pool pequeño
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# ===== JPA / Hibernate =====
# none: Hibernate no modifica las tablas de Supabase (el esquema se maneja desde Supabase).
# validate: verifica al arrancar que las entidades coinciden con las tablas (util para detectar diferencias).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== CORS =====
# Dominios del frontend que pueden llamar a la API, separados por coma (ej: http://localhost:5173,https://midominio.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
